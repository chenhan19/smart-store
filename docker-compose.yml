version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart-store-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_store
      MYSQL_USER: smartstore
      MYSQL_PASSWORD: smartstore123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smart-store-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  adminer:
    image: adminer
    container_name: smart-store-adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql

volumes:
  mysql-data:
  redis-data: