version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: smart-store-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: smart_store
      MYSQL_USER: smartstore
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-prod:/var/lib/mysql
      - ./docker/mysql/prod.cnf:/etc/mysql/conf.d/custom.cnf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      timeout: 20s
      retries: 10
    networks:
      - smart-store-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: smart-store-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis-data-prod:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - smart-store-network

  # 后端API服务
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        - NODE_ENV=production
    container_name: smart-store-api-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://smartstore:${MYSQL_PASSWORD:-changeme}@mysql:3306/smart_store?schema=public&connection_limit=5
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - smart-store-network
    volumes:
      - uploads-prod:/app/uploads
      - logs-prod:/app/logs
    command: node dist/app.js

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: smart-store-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - smart-store-network

volumes:
  mysql-data-prod:
  redis-data-prod:
  uploads-prod:
  logs-prod:

networks:
  smart-store-network:
    driver: bridge
    name: smart-store-network-prod